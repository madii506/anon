<style>
@font-face{font-family:Bowlby;src:url(/assets/fonts/bowlby.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Unbounded;src:url(/assets/fonts/unbounded.woff2) format('woff2');font-weight:200 900;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:JBM;src:url(/assets/fonts/jbm.woff2) format('woff2');font-weight:100 800;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--ease:cubic-bezier(.2,.8,.2,1);--bg:#07061a;--bg2:#0a0922;--pn:#0d0b26;--pn2:#13103a;--line:#1d1944;--line2:#2b2662;--ink:#ecebff;--sub:#b5b1e4;--dim:#7d78b0;--teal:#2ee6d6;--mag:#ff3fd2;--vio:#7b5cff;--up:#2ee69a;--dn:#ff4f6d;--cream:#f6f4ff;--ink2:#120a36;--mono:JBM,ui-monospace,SFMono-Regular,Menlo,monospace;--disp:Unbounded,Inter,system-ui,sans-serif;--pad:clamp(18px,5vw,72px)}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;scroll-behavior:smooth;color-scheme:dark}
body{font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip;font-feature-settings:"cv11","ss01"}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
::selection{background:rgba(46,230,214,.28)}
.wm,.feat,h2,.num{font-feature-settings:normal}
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------------- hero: the city at night */
.hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden;background:#07061a;color:var(--cream);isolation:isolate}
.hero .poster{position:absolute;inset:0;background:url(/assets/img/city-poster.jpg) 50% 50%/cover no-repeat;z-index:-3}
@media (orientation:portrait){.hero .poster{background-image:url(/assets/img/city-poster-m.jpg)}}
#cityGL{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-2;opacity:0;transition:opacity 1.6s var(--ease)}
#cityGL.on{opacity:1}
.hero .veil{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 46% at 50% 44%,rgba(7,6,26,.42),transparent 70%),linear-gradient(180deg,rgba(7,6,26,.35) 0%,rgba(7,6,26,0) 22%,rgba(7,6,26,0) 62%,rgba(7,6,26,.85) 94%,#07061a 100%)}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 70px;pointer-events:none}
.stack>*{pointer-events:auto}
.wm{position:relative;font-family:Bowlby,var(--disp);font-weight:400;font-size:clamp(76px,12.5vw,196px);line-height:.88;letter-spacing:-.005em;color:var(--cream);text-shadow:.045em .045em 0 var(--mag),.085em .085em 0 var(--ink2);white-space:nowrap;padding-right:.08em}
.wm .l{display:inline-block;min-width:.55em;text-align:center}
.wm .l.s{color:#9d97d8;text-shadow:none}
.spk{position:absolute;width:.13em;height:.13em;background:var(--cream);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:pop .5s 1.3s var(--ease) both,twinkle 3s 1.9s ease-in-out infinite;pointer-events:none}
.spk.s1{right:-.06em;top:-.04em}.spk.s2{right:-.2em;top:.2em;width:.06em;height:.06em;background:var(--teal);animation-delay:1.4s,2.4s}.spk.s3{left:-.12em;bottom:.04em;width:.08em;height:.08em;animation-delay:1.5s,2.8s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.5) rotate(45deg);opacity:.75}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.feat{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5em 1em;margin-top:clamp(20px,3.4vh,34px);font-family:var(--disp);font-weight:700;font-size:clamp(12px,1.15vw,16.5px);letter-spacing:.24em;text-transform:uppercase;color:var(--cream);text-shadow:.08em .08em 0 var(--ink2);animation:rise .8s .9s var(--ease) both}
.feat i{width:.62em;height:.62em;background:var(--teal);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.feat .fg{display:inline-flex;align-items:center;gap:1em;white-space:nowrap}
.hero .p{max-width:540px;margin-top:14px;font-size:clamp(15px,1.2vw,17px);line-height:1.6;color:#e2deff;text-shadow:0 1px 14px rgba(7,6,26,.8);animation:rise .8s 1.05s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(26px,4.2vh,42px);animation:rise .8s 1.05s var(--ease) both}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 30px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,letter-spacing .45s var(--ease)}
.btn:hover{letter-spacing:.24em}
.btn .a{transition:transform .35s var(--ease)}.btn:hover .a{transform:translateX(4px)}
.btn.pri{background:var(--teal);color:#04130f;box-shadow:0 5px 0 #0d6b63,0 0 40px -10px rgba(46,230,214,.7)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0d6b63,0 0 50px -8px rgba(46,230,214,.8)}
.btn.pri::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5.5s 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.btn.sec{background:rgba(246,244,255,.08);color:var(--cream);border:1.5px solid rgba(246,244,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.sec:hover{background:rgba(246,244,255,.16)}
.btn svg{flex:none}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}.links:empty{display:none}
.ca{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border-radius:999px;background:rgba(7,6,26,.6);border:1px solid var(--line2);font-family:var(--mono);font-size:12.5px}
.ca span{font-weight:800}.ca button{height:30px;padding:0 12px;border-radius:999px;background:var(--teal);color:#04130f;font-weight:800;font-size:11px;letter-spacing:.08em}
.xl{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(7,6,26,.6);border:1px solid var(--line2)}
.cue-x{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:#9d97d8;animation:rise .8s 1.6s var(--ease) both}
.cue i{width:1px;height:34px;background:linear-gradient(var(--teal),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* one screen: the city, the word, the line, the buttons. Nothing under it. */
html,body{height:100%}
@media (min-height:560px){html,body{overflow:hidden}}
@media (max-width:520px){.btn{height:50px;padding:0 20px;font-size:12.5px}.feat{flex-direction:column;letter-spacing:.16em;gap:.7em}.feat .fg{gap:.8em}.feat .fm{display:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<section class="hero" id="hero">
  <div class="poster" aria-hidden="true"></div>
  <canvas id="cityGL" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="stack">
    <h1 class="wm" id="wm" aria-label="anon"><span class="l" aria-hidden="true">a</span><span class="l" aria-hidden="true">n</span><span class="l" aria-hidden="true">o</span><span class="l" aria-hidden="true">n</span><i class="spk s1" aria-hidden="true"></i><i class="spk s2" aria-hidden="true"></i><i class="spk s3" aria-hidden="true"></i></h1>
    <div class="feat"><span class="fg"><span>Fresh wallets</span><i aria-hidden="true"></i><span>Private routes</span></span><i class="fm" aria-hidden="true"></i><span class="fg"><span>Stocks</span><i aria-hidden="true"></i><span>Perps</span><i aria-hidden="true"></i><span>Trenches</span></span></div>
    <div class="cta">
      <a class="btn pri" href="/app#safe"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 9.5C2 7.6 3.6 6.5 5.4 7l3.1.9c1 .3 2.1.4 3.5.4s2.5-.1 3.5-.4l3.1-.9c1.8-.5 3.4.6 3.4 2.5 0 4-2.6 7-5.6 7-1.7 0-2.7-1-3.2-2.2-.2-.5-.7-.8-1.2-.8s-1 .3-1.2.8C10.3 15.5 9.3 16.5 7.6 16.5 4.6 16.5 2 13.5 2 9.5Z"/></svg>Go anon <span class="a">→</span></a>
      <a class="btn sec" href="/app#overview">Enter the terminal</a>
    </div>
    <div class="links" id="caSlot"></div>
  </div>
</section>


<script src="/assets/js/config.js?v=a1"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
  const CFG = window.ANON || window.MARKETS || {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fine = matchMedia('(pointer: fine)').matches, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const short = a => a ? a.slice(0, 4) + '…' + a.slice(-4) : '';
  const api = async (a, p) => { const r = await fetch('/api/m?a=' + a + (p ? '&' + new URLSearchParams(p) : '')); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'offline'); return j; };
  const usd = x => x == null ? '—' : x >= 1e6 ? '$' + (x / 1e6).toFixed(2) + 'M' : x >= 1e3 ? '$' + (x / 1e3).toFixed(1) + 'K' : x >= 1 ? '$' + x.toFixed(2) : '$' + x.toPrecision(3);
  const pc = x => x == null ? '' : (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(2) + '%';

  // launch links: only once the coin is live
  {
    const xs = CFG.x ? `<a class="xl" href="${esc(CFG.x)}" target="_blank" rel="noopener" aria-label="anon on X"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8.1-9.3L1 2h7l4.8 6.3L18.9 2zm-1.2 18h1.9L7.1 3.9H5.1L17.7 20z"/></svg></a>` : '';
    const ca = CFG.ca ? `<div class="ca"><span>$ANON</span><code>${esc(CFG.ca.slice(0, 5))}…${esc(CFG.ca.slice(-5))}</code><button id="cp" type="button">COPY</button></div>` : '';
    $('#caSlot').innerHTML = ca + xs;
    const cp = $('#cp'); if (cp) cp.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(CFG.ca); cp.textContent = 'COPIED'; setTimeout(() => { cp.textContent = 'COPY'; }, 1400); };
  }

  // the wordmark decodes itself, like a name being revealed
  if (!still) {
    const L = $$('#wm .l'), target = L.map(l => l.textContent), G = 'ABCDEFGHKMNPRSTUVWXZ0123456789';
    L.forEach(l => { l.classList.add('s'); l.textContent = G[Math.floor(Math.random() * G.length)]; });
    const t0 = performance.now();
    (function tick(now) {
      let done = 0;
      L.forEach((l, i) => { const end = 520 + i * 190; if (now - t0 >= end) { if (l.classList.contains('s')) { l.textContent = target[i]; l.classList.remove('s'); } done++; } else if (Math.random() < 0.55) l.textContent = G[Math.floor(Math.random() * G.length)]; });
      if (done < L.length) requestAnimationFrame(tick);
    })(t0);
    setTimeout(() => L.forEach((l, i) => { l.textContent = target[i]; l.classList.remove('s'); }), 2600);
  }

  // the city at night: lights waking, a searchlight working the water (the poster shows until the first frame)
  let city = null;
  const NIGHT = { zen: [0.002, 0.003, 0.018], mid: [0.012, 0.012, 0.07], hor: [0.16, 0.05, 0.26], fog: [0.045, 0.03, 0.11], glow: [0.2, 0.07, 0.42], cl0: [0.025, 0.02, 0.05], cl1: [0.24, 0.08, 0.32], wall: 0.3, far: 0.4, neonK: 1.8, beam: 0.11, hemi: ['#5a6cff', '#05050f', 0.12], sun: ['#8fa4ff', 0.12], fill: ['#ff3fd2', 0.16], water: '#02030a', glint: '#ff7fe0', neon: ['#2ee6d6', '#ff3fd2', '#7b5cff', '#19d3ff', '#ff4f8b', '#2ee6d6', '#ff3fd2'] };
  function glOk() { try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; } }
  function boot() {
    if (still || !glOk()) return;
    import('/assets/js/city3d.js?v=a1').then(m => {
      city = m.startCity($('#cityGL'), { pal: NIGHT, fog: 0.0002, exposure: 1.0, night: 1, sunElev: 1, sunAz: 284, landmark: false, onFirst: () => $('#cityGL').classList.add('on') });
    }).catch(e => console.warn('city', e));
  }
  if (document.readyState === 'complete') setTimeout(boot, 60); else addEventListener('load', () => setTimeout(boot, 60));
  if (fine && !still) addEventListener('pointermove', e => { if (city && city.setPointer) city.setPointer(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); }, { passive: true });
  if (fine && !still) $$('.btn').forEach(b => { b.addEventListener('pointermove', e => { const r = b.getBoundingClientRect(); b.style.translate = `${((e.clientX - r.left) / r.width - 0.5) * 10}px ${((e.clientY - r.top) / r.height - 0.5) * 8}px`; }); b.addEventListener('pointerleave', () => { b.style.translate = '0 0'; }); });

})();
</script>
</body>
